<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOLMARINA: NEON HEAT</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚗</text></svg>">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      display: block;
    }
    #hud-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    #title-overlay {
      position: absolute;
      bottom: 30px;
      left: 30px;
      color: #fde047;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      pointer-events: none;
      z-index: 20;
    }
    #title-overlay h1 {
      margin: 0 0 5px 0;
      font-size: 28px;
      letter-spacing: 2px;
      font-weight: 800;
      color: #ff781f;
    }
    #title-overlay p {
      margin: 0;
      font-size: 14px;
      color: #f8fafc;
      letter-spacing: 1px;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.min.js"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="hud-layer">
    <div id="hud-stars" style="position: absolute; top: 20px; right: 20px; font-size: 24px; color: #fde047; text-shadow: 0 2px 4px rgba(0,0,0,0.8); display: none;">☆☆☆☆☆</div>
    <div id="hud-stats" style="position: absolute; top: 20px; left: 20px; color: #f8fafc; font-size: 16px; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,0.8); display: none;">
      <div>HEALTH: <span id="hud-health-val">100</span>%</div>
      <div>CASH: $<span id="hud-cash-val">5000</span></div>
    </div>
    <div id="wasted-banner" style="position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); color: #ef4444; font-size: 48px; font-weight: 900; text-shadow: 0 4px 8px rgba(0,0,0,0.9); display: none;">WASTED</div>
  </div>
  <div id="title-overlay">
    <h1>SOLMARINA: NEON HEAT</h1>
    <p>REX DALTON • PRESS ANY KEY TO DRIVE</p>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
